name: Check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Until the next Pi release, Pi's packages come from the commit in
      # .pi-main-rev, built and packed into .pi-main/.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Pi's packages
        id: pi-main
        uses: actions/cache@v4
        with:
          path: .pi-main/*.tgz
          key: pi-main-${{ hashFiles('.pi-main-rev', 'scripts/pi-main.sh') }}

      # The script installs them too; the committed lockfile must not change.
      - name: Build Pi's packages
        if: steps.pi-main.outputs.cache-hit != 'true'
        run: scripts/pi-main.sh && git diff --exit-code bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

  changelog:
    name: Validate changelog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Validate changelog entries
        run: uvx tenzir-ship validate --lenient

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:latest -color
