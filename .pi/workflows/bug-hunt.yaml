name: bug-hunt
description: Hunt correctness bugs in a target
trigger: when the user wants a focused bug pass without a full multi-lens review
doc: >-
  Reuses the canonical read-only review workflow with a strict correctness
  focus. Returns the same structured review contract as /review.
params:
  - name: target
    description: What to hunt in (a path, diff, or description)
    required: true
flow:
  kind: workflow
  name: review
  params:
    target: "{params.target}"
    focus: >-
      Review strictly for concrete correctness bugs: logic errors, broken
      invariants, edge cases, races, error-handling failures, and resource
      leaks. Skip readability-only findings and non-actionable nits.
