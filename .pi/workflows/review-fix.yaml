name: review-fix
description: Review and fix the current checkout until approved or unable to proceed
trigger: when the user explicitly asks to review and implement fixes in the current checkout, or explicitly asks to keep iterating until the review comes back clean
display: report
doc: >-
  Mutates the current working tree. Use `review` for a read-only pass. Runs
  that canonical review first, sends validated P1-P3 findings to an anonymous
  Implementer, and verifies every implementation with a fresh review. Stops
  when approved, unable to proceed, inconsistent, or after three complete
  implementation-and-review rounds.
params:
  - name: target
    description: The editable change in the current checkout to review and fix
    required: true
flow:
  kind: sequence
  steps:
    - kind: workflow
      name: review
      params:
        target: "{params.target}"
      as: initial_review

    # Normalize semantic relationships before downstream nodes dereference
    # the structurally validated review result.
    - kind: switch
      on: "{initial_review}"
      as: initial_state
      cases:
        - when:
            and:
              - eq: [outcome, approved]
              - eq: [reason, null]
              - empty: actionable
          then:
            kind: value
            value:
              outcome: approved
              reason: null
              round_index: null
              report: "{initial_review.report}"
              actionable: "{initial_review.actionable}"
              implementation: null

        - when:
            and:
              - eq: [outcome, changes_required]
              - eq: [reason, null]
              - not:
                  empty: actionable
          then:
            kind: value
            value:
              outcome: changes_required
              reason: null
              round_index: null
              report: "{initial_review.report}"
              actionable: "{initial_review.actionable}"
              implementation: null

        - when:
            and:
              - eq: [outcome, cannot_proceed]
              - not:
                  empty: reason
          then:
            kind: value
            value:
              outcome: cannot_proceed
              reason: "{initial_review.reason}"
              round_index: null
              report: "{initial_review.report}"
              actionable: "{initial_review.actionable}"
              implementation: null

      else:
        kind: value
        value:
          outcome: cannot_proceed
          reason: The Reviewer returned semantically inconsistent review data.
          round_index: null
          report: null
          actionable: []
          implementation: null

    - kind: while
      on: "{initial_state}"
      condition:
        eq: [outcome, changes_required]
      max: 3
      as: cycle_result
      body:
        kind: sequence
        steps:
          - kind: agent
            thinking: high
            skills: []
            as: implementation
            task: |-
              Act as the Implementer for {params.target}.

              Current review report:
              {current.report}

              Actionable P1-P3 findings:
              {current.actionable}

              Work only in the current checkout. Before modifying files,
              verify that the target describes the checked-out change. Do
              not check out another branch, push, create commits, reply to
              review comments, or resolve review threads. If the target is
              not editable here, make no changes and report that blocker.

              Validate every actionable finding against the current code.
              Implement the valid P1-P3 fixes without unrelated cleanup or
              opportunistic refactoring. Run the narrowest relevant tests,
              type checks, and lint checks. Do not claim that the result is
              clean; the next Reviewer makes that determination.

              Submit a concise Markdown summary as the complete agent result,
              containing:
              - the implementation status;
              - changed files and what changed;
              - checks run and their results;
              - skipped or rejected findings with reasons;
              - unresolved blockers.

          - kind: workflow
            name: review
            params:
              target: "{params.target}"
              focus: >-
                Perform a full verification review with the normal risk-based
                lens selection. Confirm whether every prior actionable finding
                is resolved and detect regressions introduced by the
                implementation.
              context: |-
                Repair round {iteration} (zero-based) was just attempted.

                Previous review report:
                {current.report}

                Previous actionable findings:
                {current.actionable}

                Implementer summary:
                {implementation}
            as: verified_review

          # Recreate the same normalized state after each repair round.
          - kind: switch
            on: "{verified_review}"
            cases:
              - when:
                  and:
                    - eq: [outcome, approved]
                    - eq: [reason, null]
                    - empty: actionable
                then:
                  kind: value
                  value:
                    outcome: approved
                    reason: null
                    round_index: "{iteration}"
                    report: "{verified_review.report}"
                    actionable: "{verified_review.actionable}"
                    implementation: "{implementation}"

              - when:
                  and:
                    - eq: [outcome, changes_required]
                    - eq: [reason, null]
                    - not:
                        empty: actionable
                then:
                  kind: value
                  value:
                    outcome: changes_required
                    reason: null
                    round_index: "{iteration}"
                    report: "{verified_review.report}"
                    actionable: "{verified_review.actionable}"
                    implementation: "{implementation}"

              - when:
                  and:
                    - eq: [outcome, cannot_proceed]
                    - not:
                        empty: reason
                then:
                  kind: value
                  value:
                    outcome: cannot_proceed
                    reason: "{verified_review.reason}"
                    round_index: "{iteration}"
                    report: "{verified_review.report}"
                    actionable: "{verified_review.actionable}"
                    implementation: "{implementation}"

            else:
              kind: value
              value:
                outcome: cannot_proceed
                reason: The Reviewer returned semantically inconsistent verification data.
                round_index: "{iteration}"
                report: null
                actionable: []
                implementation: "{implementation}"

    # A while node returns only its carried value. If that value still asks
    # for changes after the cap, classify it as exhaustion here.
    - kind: switch
      on: "{cycle_result}"
      cases:
        - when:
            eq: [outcome, changes_required]
          then:
            kind: value
            value:
              outcome: exhausted
              reason: The workflow reached its implementation-round limit with actionable findings remaining.
              round_index: "{cycle_result.round_index}"
              report: "{cycle_result.report}"
              actionable: "{cycle_result.actionable}"
              implementation: "{cycle_result.implementation}"
      else:
        kind: value
        value: "{cycle_result}"
