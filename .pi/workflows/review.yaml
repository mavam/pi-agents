name: review
description: Review a target with risk-selected lenses and structured findings
trigger: when the user asks for a read-only code review of a change, pull request, path, or subsystem
doc: >-
  Runs one self-contained anonymous high-thinking reviewer. Returns
  machine-readable review state together with the complete Markdown report
  and never modifies the target. Use `review-fix` only when you explicitly
  want a workflow that mutates the current working tree.
params:
  - name: target
    description: What to review (a pull request, local change, path, or description)
    required: true
  - name: focus
    description: Optional review emphasis
    default: Apply the normal risk-based lens selection.
  - name: context
    description: Optional prior findings and implementation summary for verification
    default: No prior review or implementation context.
task: |-
  Review {params.target}.

  Review focus:
  {params.focus}

  Prior round context:
  {params.context}

  This is a read-only review. Do not modify files, create commits, push, reply
  to review comments, or resolve review threads.

  First understand the target's intent, then inspect the complete relevant
  diff or changed code. For a pull request, read its description, commits,
  full diff, and existing review feedback; verify prior comments against the
  current code and avoid duplicating resolved concerns. For local changes,
  inspect committed changes from the default branch's merge base plus staged
  and unstaged changes. Focus on behavior introduced by the change and read
  adjacent unchanged code only when needed to verify impact. Always review
  for correctness and readability. Select additional risk lenses when applicable:
  - Security for input, authentication, networking, secrets, or dependencies.
  - Architecture for public APIs, module boundaries, configuration, or schemas.
  - User experience for CLI output, errors, and defaults.
  - Performance for hot paths, loops, queries, or large data.
  - Tests for new behavior and branches.
  - Documentation for docs, examples, or public behavior.

  Report only findings that are specific, actionable, and grounded in concrete
  code or observable behavior. Group symptoms that share one root cause. For a
  normal-sized change, report at most eight findings and prioritize the highest
  risks. Treat formatting and mechanical consistency as tooling concerns when
  the project already enforces them.

  Rate impact separately from certainty:
  - P1: security flaws, data loss, crashes, or release blockers.
  - P2: broken features, serious regressions, or major correctness gaps.
  - P3: smaller bugs, coverage gaps, or usability problems that should be fixed.
  - P4: low-impact polish or consistency improvements.
  Use the fixed report markers 🔴 P1, 🟠 P2, 🟡 P3, and ⚪ P4.

  Include only high-confidence findings in the actionable review: point to the
  exact code and explain the concrete failure mode or harm. Put plausible but
  unverified medium-confidence concerns in lower_confidence_observations. Drop
  low-confidence hunches. Treat P1, P2, and P3 findings as actionable. Keep P4
  observations in the report, but exclude them from the actionable array.

  For every finding, use an imperative fix title and provide the problem, a
  specific fix, supporting context or evidence, and precise file locations.
  Assign a stable ID and use these fixed category mappings in the report:
  - BUG / 🐛 / correctness
  - SEC / 🛡️ / security
  - ARC / 🏗️ / architecture
  - TST / 🧪 / tests
  - UXD / 🎨 / user_experience
  - RDY / 👁️ / readability
  - DOC / 📖 / documentation
  - PRF / 🚀 / performance
  - GRP / 📦 / grouped, only for symptoms with one shared root cause

  Keep the JSON fields plain and machine-readable: severity is P1, P2, or P3;
  category is the mapping's text value; and id combines its prefix with a
  sequence number. Emojis appear only in the Markdown report and must always
  be paired with their text label.

  The Markdown report must contain `# Code Review`, a short context statement,
  `## Overview`, `## Findings`, and `## Verdict`, plus optional
  `## Lower-confidence observations`. Use one verdict: `Ship it` for no
  findings or P4 only; `Ship with fixes` for P3 or below; `Needs changes` for
  any P2; or `Blocked` for any P1.

  In `## Overview`, list every high-confidence finding in severity order as a
  one-line to-do item. For example:
  `- 🟠 P2 · 🐛 BUG-1 · Reject malformed workflow state`

  In `## Findings`, use the same visual identity as the heading. For example:
  `### 🟠 P2 · 🐛 BUG-1 · Reject malformed workflow state`
  Follow it with one or two sentences describing the problem, a `**Fix:**`
  paragraph with the concrete action, and a blockquote starting with
  `Context:` that contains the evidence and a blockquoted list of backticked
  `file:line` locations. Keep emojis out of the finding body.

  In `## Verdict`, put the bold verdict label first, then this table with the
  actual counts in its last row:
  | 🔴 P1 | 🟠 P2 | 🟡 P3 | ⚪ P4 |
  | :---: | :---: | :---: | :---: |
  | count | count | count | count |
  End with concrete next-step bullets.

  When prior round context is present, verify the actual current code rather
  than trusting the implementation summary. Set stalled to true only when the
  same material actionable finding remains after an attempted implementation
  with no meaningful progress. Set cannot_proceed to true when the review
  cannot be completed safely or required context or prerequisites are missing.
  Otherwise set both flags to false.

  End with exactly one raw JSON object using this contract:
  {
    "counts": {"p1": 0, "p2": 0, "p3": 0, "p4": 0},
    "actionable": [
      {
        "id": "BUG-1",
        "severity": "P2",
        "category": "correctness",
        "title": "Imperative fix title",
        "problem": "Concrete description of what is wrong",
        "fix": "Specific implementation action",
        "context": "Evidence and reasoning that validate the finding",
        "locations": ["src/file.ts:10-20"]
      }
    ],
    "stalled": false,
    "cannot_proceed": false,
    "reason": null,
    "lower_confidence_observations": [],
    "report": "Complete Markdown report following the format described earlier"
  }

  Keep counts consistent with the full report. Include every P1-P3 finding in
  actionable and no P4 findings there. Use a non-empty reason when stalled or
  cannot_proceed is true. Put the complete human-readable Markdown review in
  report despite returning JSON.
thinking: high
output: json
