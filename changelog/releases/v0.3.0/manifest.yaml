title: Algebraic workflows
intro: >-
  A ground-up rewrite around an explicit workflow algebra: closed expression
  trees (agent, seq, par, map, loop, workflow) with explicit data bindings,
  saved workflow definitions, and three trigger surfaces — the model, slash
  commands, and pi events. Not compatible with v0.2 flow definitions or
  persisted run history.
