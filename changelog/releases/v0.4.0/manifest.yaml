title: Ad-hoc agents and live workflow control
intro: >-
  Pi Agents now runs ad-hoc workflow agents without predefined profiles and adds per-agent
  inspection, live steering, and event-bus control. Reliable delegated completion,
  uncropped persisted results, stable previews, and compact footer counters make long-running
  workflows easier to operate.
