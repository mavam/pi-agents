title: Lazy MCP startup, structured codemode outputs, and shared tool guidance
intro: >-
  Agents now open without waiting for every Model Context Protocol server to connect
  and instead wait lazily only for the servers a call actually reaches. Shared extension
  and server tools also forward their output schemas, structured results, prompt snippets,
  and guidelines to agents just as they do in Pi.
